[build]
  command = "npm install && npm run build --workspace client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

# Force www → apex so there's one canonical host (matches https://blackquill.in)
[[redirects]]
  from = "https://www.blackquill.in/*"
  to = "https://blackquill.in/:splat"
  status = 301
  force = true

# SPA fallback (also covered by client/public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
